<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your email – IT-Learn</title>
  </head>
  <body style="margin:0;padding:0;background-color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#1a1a1a;padding:40px 0;">
      <tr>
        <td align="center">
          <table width="560" cellpadding="0" cellspacing="0" style="background-color:#262626;border-radius:10px;overflow:hidden;">
            <!-- Header -->
            <tr>
              <td style="padding:40px 48px 32px;border-bottom:1px solid rgba(255,255,255,0.1);">
                <span style="font-size:20px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">IT-Learn</span>
              </td>
            </tr>
            <!-- Body -->
            <tr>
              <td style="padding:40px 48px;">
                <h1 style="margin:0 0 12px;font-size:24px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">Verify your email address</h1>
                <p style="margin:0 0 32px;font-size:15px;line-height:1.6;color:#a3a3a3;">
                  Thanks for signing up! Click the button below to verify your email address and activate your account.
                </p>
                <a href="{{link}}" style="display:inline-block;background-color:#ffffff;color:#1a1a1a;font-size:14px;font-weight:600;text-decoration:none;padding:12px 28px;border-radius:6px;">
                  Verify email address
                </a>
                <p style="margin:32px 0 0;font-size:13px;line-height:1.6;color:#737373;">
                  Or copy and paste this link into your browser:<br />
                  <a href="{{link}}" style="color:#a3a3a3;word-break:break-all;">{{link}}</a>
                </p>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td style="padding:24px 48px;border-top:1px solid rgba(255,255,255,0.1);">
                <p style="margin:0;font-size:12px;color:#525252;">
                  If you didn't create an IT-Learn account, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
